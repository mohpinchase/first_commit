<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register • UniPeer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
</head>
<body>
  <div id="navbar-root" data-component="/components/navbar.html"></div>

  <main class="auth-wrapper">
    <div class="card auth-card">
      <div class="auth-header">
        <h1>Create your account</h1>
        <p class="muted">Join UniPeer and start collaborating</p>
      </div>
      <form id="register-form">
        <div class="form-row inline">
          <div class="field-group">
            <label class="label" for="first_name">First name</label>
            <input id="first_name" name="first_name" type="text" placeholder="Aisha" required />
          </div>
          <div class="field-group">
            <label class="label" for="last_name">Last name</label>
            <input id="last_name" name="last_name" type="text" placeholder="Khan" required />
          </div>
        </div>
        <div class="field-group">
          <label class="label" for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="aishak" required />
        </div>
        <div class="field-group">
          <label class="label" for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@university.edu" required />
        </div>
        <div class="form-row inline">
          <div class="field-group">
            <label class="label" for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required />
          </div>
          <div class="field-group">
            <label class="label" for="password_confirm">Confirm Password</label>
            <input id="password_confirm" name="password_confirm" type="password" placeholder="••••••••" required />
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Create account</button>
          <a class="btn btn-outline" href="/auth/login.html">I already have an account</a>
        </div>
      </form>
      <div class="auth-footer">By registering you agree to our terms.</div>
    </div>
  </main>

  <div id="footer-root" data-component="/components/footer.html"></div>

  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/auth.pages.js"></script>
</body>
</html>
